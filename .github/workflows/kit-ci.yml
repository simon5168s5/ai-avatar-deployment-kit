name: 驗證 Deployment Kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 安裝器與部署契約
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test
      - name: 驗證 Workflow 與 Blueprint YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml", "student-template/.github/workflows/*.yml", "student-template/render.yaml"].flatten.each { |file| YAML.load_file(file); puts "OK #{file}" }'
      - run: git diff --check
