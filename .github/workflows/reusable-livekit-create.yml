name: 共用初始化 LiveKit Agent

on:
  workflow_call:
    inputs:
      voice-agent-directory:
        description: Voice Agent 所在目錄
        required: false
        type: string
        default: apps/voice-agent
    secrets:
      LIVEKIT_URL:
        required: true
      LIVEKIT_API_KEY:
        required: true
      LIVEKIT_API_SECRET:
        required: true
      LIVEKIT_AGENT_SECRET_LIST:
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.repository }}-livekit-create
  cancel-in-progress: false

jobs:
  create:
    name: 建立 LiveKit Production Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      SECRET_LIST: ${{ secrets.LIVEKIT_AGENT_SECRET_LIST }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 防止重複建立 Agent
        env:
          CONFIG_PATH: ${{ inputs.voice-agent-directory }}/livekit.toml
        run: test ! -f "$CONFIG_PATH"
      - name: 建立 Agent
        uses: livekit/deploy-action@48cc4d2614132f7d67d04d38c62b47ba29c027e0 # v2.12.2
        with:
          OPERATION: create
          WORKING_DIRECTORY: ${{ inputs.voice-agent-directory }}
      - name: 建立 livekit.toml Pull Request
        env:
          CONFIG_PATH: ${{ inputs.voice-agent-directory }}/livekit.toml
          BRANCH_NAME: cloud-agent-${{ github.run_id }}
        run: |
          test -f "$CONFIG_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH_NAME"
          git add -- "$CONFIG_PATH"
          git commit -m "設定：加入 LiveKit Agent 設定"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "設定：加入 LiveKit Agent 設定" \
            --body "由 LiveKit 官方部署流程產生學生專屬 livekit.toml。合併前請確認 GitHub Actions 全數通過。"
      - name: 等待 Agent Running
        uses: livekit/deploy-action@48cc4d2614132f7d67d04d38c62b47ba29c027e0 # v2.12.2
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: ${{ inputs.voice-agent-directory }}
          TIMEOUT: 5m
