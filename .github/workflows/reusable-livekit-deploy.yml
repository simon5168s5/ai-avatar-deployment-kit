name: 共用部署 LiveKit Agent

on:
  workflow_call:
    inputs:
      voice-agent-directory:
        description: Voice Agent 所在目錄
        required: false
        type: string
        default: apps/voice-agent
    secrets:
      LIVEKIT_URL:
        required: true
      LIVEKIT_API_KEY:
        required: true
      LIVEKIT_API_SECRET:
        required: true
      LIVEKIT_AGENT_SECRET_LIST:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-livekit-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署 LiveKit Production Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      SECRET_LIST: ${{ secrets.LIVEKIT_AGENT_SECRET_LIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 確認 Agent 已完成首次註冊
        env:
          CONFIG_PATH: ${{ inputs.voice-agent-directory }}/livekit.toml
        run: test -f "$CONFIG_PATH"
      - name: 部署 Agent
        uses: livekit/deploy-action@48cc4d2614132f7d67d04d38c62b47ba29c027e0 # v2.12.2
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: ${{ inputs.voice-agent-directory }}
      - name: 等待 Agent Running
        uses: livekit/deploy-action@48cc4d2614132f7d67d04d38c62b47ba29c027e0 # v2.12.2
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: ${{ inputs.voice-agent-directory }}
          TIMEOUT: 5m
