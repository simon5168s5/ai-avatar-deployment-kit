name: 共用驗證學員 AI 分身

on:
  workflow_call:
    inputs:
      voice-agent-directory:
        description: Voice Agent 所在目錄
        required: false
        type: string
        default: apps/voice-agent

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript、測試與 Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  voice-agent:
    name: Python Voice Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.voice-agent-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.voice-agent-directory }}/requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m pip check
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q src
